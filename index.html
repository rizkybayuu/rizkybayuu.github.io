<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rizkyby.web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg-base"></div>
  <div id="bg-sunset"></div>
  <div id="mouse-glow"></div>

  <main id="app">
    <div class="content-card">
      <!-- Fixed Slot 1: Welcome line -->
      <div class="text-slot slot-welcome">
        <span id="text-welcome"></span>
      </div>

      <!-- Fixed Slot 2: Main title -->
      <div class="text-slot slot-title">
        <span id="text-title"></span>
      </div>

      <!-- Fixed Slot 3: Subtitle / tagline -->
      <div class="text-slot slot-sub">
        <span id="text-sub"></span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
